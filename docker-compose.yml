version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: nyayasaathi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyayasaathi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyayasaathi_secure_change_me_in_prod}
      POSTGRES_DB: ${POSTGRES_DB:-nyayasaathi_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyayasaathi} -d ${POSTGRES_DB:-nyayasaathi_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyayasaathi_internal

  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: nyayasaathi_qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nyayasaathi_internal

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nyayasaathi_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyayasaathi}:${POSTGRES_PASSWORD:-nyayasaathi_secure_change_me_in_prod}@postgres:5432/${POSTGRES_DB:-nyayasaathi_db}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION_NAME: nyayasaathi_legal_corpus
      SECRET_KEY: ${SECRET_KEY:-nyayasaathi_default_dev_secret_change_in_production}
      LLM_PRIMARY_PROVIDER: ${LLM_PRIMARY_PROVIDER:-gemini}
      LLM_FALLBACK_PROVIDER: ${LLM_FALLBACK_PROVIDER:-openrouter}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-NyayaSaathi AI}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    networks:
      - nyayasaathi_internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nyayasaathi_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
    ports:
      - "3000:3000"
    networks:
      - nyayasaathi_internal

networks:
  nyayasaathi_internal:
    driver: bridge

volumes:
  postgres_data:
  qdrant_storage:
